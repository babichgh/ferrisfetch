[package]
name = "ferrisfetch"
version = "1.2.0"
edition = "2024"
description = "A fastfetch clone written in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/babichgh/ferrisfetch"
keywords = ["fastfetch", "neofetch", "system", "info", "cli"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4.6.7", features = ["derive"] }
owo-colors = "4.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
terminal_size = "0.4.4"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "termios", "fs", "event"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1", features = ["pty"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
